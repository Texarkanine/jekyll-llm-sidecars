usage: opensource

integration:
  name: rspec

includes:
  - lib
  - spec

requires:
  - ./spec/support/mutant_setup.rb

matcher:
  subjects:
    - Jekyll::LlmsTxt*

mutation:
  # A neutral that runs the generator suite can exceed the 5s default.
  timeout: 30.0
  ignore_patterns:
    # Inside module Jekyll these names are one constant.
    - const{name=Utils base=const{name=Jekyll}}
    - const{name=Page base=const{name=Jekyll}}
    - const{name=Renderer base=const{name=Jekyll}}
    - const{name=LlmsTxt base=const{name=Jekyll}}
